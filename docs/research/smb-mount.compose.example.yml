# SMB 掛載範例（研究用，未套用到正式 docker-compose.yml）
# 對應報告：docs/research/SMB-MOUNT-FROM-CONTAINER.md
#
# 用法：把需要的片段合併進 docker-compose.yml，或用 override：
#   docker compose -f docker-compose.yml -f docs/research/smb-mount.compose.example.yml config
#
# 前置：
#   1. 主機 ISIN、SERVER 在路由器做 DHCP 保留（固定 IP）。cifs 掛載後記住的是 IP，不會自動重新解析主機名。
#   2. 先確認兩台 Windows 支援的最高 SMB 版本（Win7／2008 R2 = SMB 2.1；XP／2003 只有 SMB1）。
#      能用 2.1 就不要用 1.0（見報告 2.2 節：SMB1 + oplock 下 byte-range lock 衝突未被執行）。
#   3. 帳密放在 .env（不進 Git）或 secrets 檔（權限 600），不要寫死在本檔。

# ─────────────────────────────────────────────────────────────────────────────
# 方案 A（建議用於 DXF／CNC 唯讀）：沿用現有 NasService 在容器內 mount -t cifs
#   - 後端已經是 privileged + cifs-utils，只需把 /etc/auto_nas 的每個 share 加上
#     各自的 vers/ro/cache 選項，並改用 credentials 檔（見報告第 4 節）。
#   - 優點：SERVER 關機時 backend 照樣能啟動，掛載失敗只影響圖檔功能，可在背景重試。
# ─────────────────────────────────────────────────────────────────────────────
services:
  backend:
    # privileged 可縮成以下兩個 capability（OrbStack 2.2.3 實測可掛 cifs）
    # privileged: false
    cap_add:
      - SYS_ADMIN        # mount(2)
      - DAC_READ_SEARCH  # mount.cifs 需要
    environment:
      # 由 NasService 掛到 /nas/<key>；key 與 /etc/auto_nas 一致
      LEGACY_DXF_PATH: ${LEGACY_DXF_PATH:-/nas/c}          # \\Server\C\ → {圖號第1字}/{前3字}/{圖號}.DXF
      LEGACY_CNC_PATH: ${LEGACY_CNC_PATH:-/nas/n}          # \\SERVER\n\ → {圖號}.cnc
      LEGACY_MDB_PATH: ${LEGACY_MDB_PATH:-/nas/isin}       # \\ISIN\isin\ → *.mdb（預設唯讀）
      # SMB I/O 在 libuv threadpool 上執行；伺服器卡住時 fs 呼叫會一直佔住 thread。
      # 拉高 pool，並在程式端用 semaphore 限制同時進行的 SMB 呼叫數（見報告 2.2 節）。
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
    secrets:
      - smb_server_cred
      - smb_isin_cred

secrets:
  # 檔案內容（mount.cifs credentials 格式）：
  #   username=xxxx
  #   password=xxxx
  #   domain=WORKGROUP
  smb_server_cred:
    file: ./secrets/smb_server.cred
  smb_isin_cred:
    file: ./secrets/smb_isin.cred

# NasService 對應的 mount 參數建議（/etc/auto_nas 加欄位或改成 JSON 設定）：
#   DXF  //<SERVER_IP>/c     -o credentials=/run/secrets/smb_server_cred,vers=2.1,ro,iocharset=utf8,actimeo=60,echo_interval=10,soft
#   CNC  //<SERVER_IP>/n     -o credentials=/run/secrets/smb_server_cred,vers=2.1,ro,iocharset=utf8,actimeo=10,echo_interval=10,soft
#   MDB  //<ISIN_IP>/isin    -o credentials=/run/secrets/smb_isin_cred,vers=2.1,ro,iocharset=utf8,cache=none,actimeo=0,echo_interval=10,soft
#   （共存研究若真的要在 Linux 端寫：vers>=2.1,rw,cache=none,nolease；絕不用 vers=1.0）

# ─────────────────────────────────────────────────────────────────────────────
# 方案 B（替代）：Docker local volume driver type=cifs
#   - 掛載在 OrbStack 的 Linux VM 內完成，容器本身不需要 privileged。
#   - 缺點：(1) 密碼會出現在 `docker volume inspect`；local driver 用 mount(2)，
#     不支援 credentials= 檔。(2) 容器啟動時 SMB 主機不在，整個 backend 起不來
#     （error while mounting volume）。(3) driver_opts 改了要 `docker volume rm` 重建。
#   若採用，建議掛在獨立的小服務（例如 legacy-files）而不是 backend 上。
# ─────────────────────────────────────────────────────────────────────────────
#
# services:
#   backend:
#     volumes:
#       - legacy_dxf:/mnt/legacy/dxf:ro
#       - legacy_cnc:/mnt/legacy/cnc:ro
#     environment:
#       LEGACY_DXF_PATH: /mnt/legacy/dxf
#       LEGACY_CNC_PATH: /mnt/legacy/cnc
#
# volumes:
#   legacy_dxf:
#     driver: local
#     driver_opts:
#       type: cifs
#       device: "//${SMB_SERVER_IP}/c"
#       o: "addr=${SMB_SERVER_IP},username=${SMB_SERVER_USER},password=${SMB_SERVER_PASS},vers=2.1,ro,iocharset=utf8,actimeo=60,echo_interval=10,soft"
#   legacy_cnc:
#     driver: local
#     driver_opts:
#       type: cifs
#       device: "//${SMB_SERVER_IP}/n"
#       o: "addr=${SMB_SERVER_IP},username=${SMB_SERVER_USER},password=${SMB_SERVER_PASS},vers=2.1,ro,iocharset=utf8,actimeo=10,echo_interval=10,soft"
#   legacy_mdb_ro:   # 只在切換日 / 研究時使用
#     driver: local
#     driver_opts:
#       type: cifs
#       device: "//${SMB_ISIN_IP}/isin"
#       o: "addr=${SMB_ISIN_IP},username=${SMB_ISIN_USER},password=${SMB_ISIN_PASS},vers=2.1,ro,iocharset=utf8,cache=none,actimeo=0,soft"
#
# ─────────────────────────────────────────────────────────────────────────────
# 不建議：macOS 主機 mount_smbfs 後 bind mount（/Volumes/xxx:/mnt/...）
#   本機實測在 OrbStack 造成容器卡在 Created、之後所有含 bind mount 的容器都無法啟動，
#   umount 卡在核心 >1 小時（報告 2.1、3.4 節）。
# ─────────────────────────────────────────────────────────────────────────────
